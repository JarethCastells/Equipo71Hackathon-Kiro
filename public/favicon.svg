<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Ring -->
  <rect x="40" y="40" width="432" height="432" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>

  <!-- TalentFlow AI Neural Spark Icon -->
  <g filter="url(#glow)">
    <!-- Central AI Diamond Star -->
    <path d="M256 112 Q256 256 112 256 Q256 256 256 400 Q256 256 400 256 Q256 256 256 112 Z" fill="url(#sparkGrad)" />
    
    <!-- Top-Right Mini Sparkle -->
    <path d="M370 120 Q370 160 330 160 Q370 160 370 200 Q370 160 410 160 Q370 160 370 120 Z" fill="#38bdf8" />
    
    <!-- Connection Dots / Talent Nodes -->
    <circle cx="160" cy="160" r="16" fill="#67e8f9" />
    <circle cx="352" cy="352" r="16" fill="#a78bfa" />
    <circle cx="160" cy="352" r="12" fill="#c084fc" />
  </g>
</svg>
